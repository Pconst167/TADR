name: Validate main-map radar contacts
on:
  push:
    branches: ['feature/main-map-radar', 'feature/main-map-radar-test']
  pull_request:
    paths:
      - 'src/DDraw/MainMapRadar.*'
      - 'src/DDraw/TABugFix.cpp'
      - 'src/DDraw/test/main_map_radar_test.py'
      - '.github/workflows/main-map-radar.yml'
permissions:
  contents: read
jobs:
  behavior:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test radar visibility, projection and clipping
        run: python3 src/DDraw/test/main_map_radar_test.py
      - name: Check existing features in the combined test build
        if: github.ref == 'refs/heads/feature/main-map-radar-test'
        run: |
          python3 src/DDraw/test/mex_upgrade_test.py
          python3 src/DDraw/test/build_rectangle_input_test.py
          python3 src/DDraw/test/build_rectangle_gesture_test.py
          python3 src/DDraw/test/drawn_move_input_test.py
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        mod: [ESCALATION, PROTA, OTA]
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64_x86
      - name: Build patch DLL
        run: msbuild src/DDraw/ddraw.vcxproj /p:Configuration=ReleasePublic /p:Platform=Win32 /p:TDRAW_CONFIG=TDRAW_CONFIG_${{ matrix.mod }}
      - name: Verify radar overlay support
        run: python -c "from pathlib import Path; assert b'[MainMapRadar] build=contacts-v2-large' in Path('src/DDraw/Public/tdraw.dll').read_bytes()"
      - name: Verify Windows 7 imports
        run: python src/DDraw/tools/check_win7_imports.py src/DDraw/Public/tdraw.dll
      - name: Verify earlier features in the combined build
        if: github.ref == 'refs/heads/feature/main-map-radar-test'
        run: python -c "from pathlib import Path; b=Path('src/DDraw/Public/tdraw.dll').read_bytes(); assert b'[BuildRectangle] release-v4' in b; assert '${{ matrix.mod }}' == 'OTA' or b'[DrawnMove] build=alt-v6' in b; assert (b'[MexUpgrade] build=escalation-cursors-v8' in b) == ('${{ matrix.mod }}' == 'ESCALATION')"
      - uses: actions/upload-artifact@v4
        with:
          name: main-map-radar-${{ matrix.mod }}
          path: |
            src/DDraw/Public/tdraw.dll
            src/DDraw/Public/tdraw.pdb
            src/DDraw/Public/tdraw.map
